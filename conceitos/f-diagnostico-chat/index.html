<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#ece9e2">
  <title>Uma conversa sobre seu gargalo | Feed</title>
  <link rel="stylesheet" href="assets/chat.css">
  <script src="assets/regras.js" defer></script>
  <script src="assets/chat.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="topo">
      <img src="assets/logo-preta.svg" width="90" height="30" alt="Feed">
      <div class="identidade"><strong data-nome></strong><span>Diagnóstico do Gargalo</span></div>
      <span class="conceito">Conceito</span>
    </header>
    <main id="conversa" aria-label="Conversa do diagnóstico" tabindex="-1"><div class="coluna" id="mensagens"></div></main>
    <footer class="dock"><div class="dock-coluna">
      <section id="painel" aria-label="Sua próxima resposta"></section>
      <form id="compositor" class="compositor">
        <label class="sr" for="texto">Sua mensagem</label>
        <textarea id="texto" rows="1" maxlength="1200" placeholder="Ou conte do seu jeito..."></textarea>
        <button type="submit" id="enviar" class="enviar" aria-label="Enviar resposta" disabled>↑</button>
      </form>
      <p class="rodape"><span>Conceito roteirizado. Nenhum envio automático.</span><span class="desktop">Ribeirão Preto e região.</span></p>
    </div></footer>
  </div>
  <div id="anuncio" class="sr" role="status" aria-live="polite"></div>
  <noscript>Ative o JavaScript para conversar. Neste conceito nenhum dado é enviado.</noscript>
</body>
</html>
